[project]
name = "logseal"
version = "0.1.0"
description = "Tamper-evident security log with independent vault witnesses"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
# Start with real bugs only (undefined names, unused imports). Tighten later if the team agrees.
select = ["F"]
